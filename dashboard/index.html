<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假性甲狀腺素機器學習分類報告</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js@2.26.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        .tab-button {
            flex: 1;
            padding: 18px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 500;
            color: #495057;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .tab-button:hover {
            background: #e9ecef;
            color: #667eea;
        }
        
        .tab-button.active {
            color: #667eea;
            background: white;
        }
        
        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .tab-content {
            display: none;
            padding: 40px;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .report-section {
            margin-bottom: 40px;
            line-height: 1.8;
        }
        
        .report-section h2 {
            color: #333;
            font-size: 1.6em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.95em;
        }
        
        .results-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        .results-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .results-table tr:hover {
            background: #f8f9fa;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .metric-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .metric-card .value {
            font-size: 2em;
            font-weight: 700;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            min-height: 400px;
        }
        
        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            font-size: 0.9em;
        }
        
        .comparison-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        .comparison-table td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        
        .value-high { color: #28a745; font-weight: 700; }
        .value-medium { color: #ffc107; font-weight: 700; }
        .value-low { color: #dc3545; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>假性甲狀腺素 ML 分類系統</h1>
            <p>海大資工 — 機器學習作業報告與互動式分析儀表板</p>
        </div>
        
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab(event, ''report'')">作業報告</button>
            <button class="tab-button" onclick="switchTab(event, ''dashboard'')">完整分析儀表板</button>
        </div>
        
        <div id="report" class="tab-content active">
            <div class="report-section">
                <h2>（一）實驗結果</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>系統</th>
                            <th>分類器</th>
                            <th>系統設定</th>
                            <th>正確率</th>
                            <th>精準度</th>
                            <th>召回率</th>
                            <th>F1 分數</th>
                        </tr>
                    </thead>
                    <tbody id="report-results-body"></tbody>
                </table>
            </div>
            
            <div class="report-section">
                <h2>（二）系統比較</h2>
                <p id="comparison-text"></p>
            </div>
            
            <div class="report-section">
                <h2>（三）結論</h2>
                <p id="conclusion-text"></p>
            </div>
        </div>
        
        <div id="dashboard" class="tab-content">
            <div class="metrics-grid" id="metrics-container"></div>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">正確率排名</div>
                    <canvas id="accuracyChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">多維度評估</div>
                    <canvas id="radarChart"></canvas>
                </div>
                <div class="chart-container full-width">
                    <div class="chart-title">詳細指標對照表</div>
                    <table class="comparison-table" id="metrics-table">
                        <thead>
                            <tr>
                                <th>分類器</th>
                                <th>正確率</th>
                                <th>精準度</th>
                                <th>召回率</th>
                                <th>F1 分數</th>
                                <th>推論時間</th>
                                <th>系統設定</th>
                            </tr>
                        </thead>
                        <tbody id="metrics-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let dashboardData = null;
        
        fetch(''dashboard_data.json'')
            .then(r => r.json())
            .then(data => {
                dashboardData = data;
                populateTables();
                populateMetrics();
                initializeCharts();
                generateComparison();
            })
            .catch(err => {
                document.body.innerHTML += ''<p style="color:red;padding:20px;">Failed to load dashboard data</p>'';
            });
        
        function switchTab(evt, tabName) {
            document.querySelectorAll(''.tab-content'').forEach(t => t.classList.remove(''active''));
            document.querySelectorAll(''.tab-button'').forEach(b => b.classList.remove(''active''));
            document.getElementById(tabName).classList.add(''active'');
            evt.target.classList.add(''active'');
        }
        
        function populateTables() {
            const tbody = document.getElementById(''report-results-body'');
            const metricsBody = document.getElementById(''metrics-body'');
            
            dashboardData.classifiers.forEach((c, i) => {
                const row1 = tbody.insertRow();
                row1.innerHTML = ''<td>'' + String.fromCharCode(65 + i) + ''</td><td>'' + c.label + ''</td><td>'' + c.config + ''</td><td>'' + (c.metrics.accuracy * 100).toFixed(2) + ''%</td><td>'' + (c.metrics.precision * 100).toFixed(2) + ''%</td><td>'' + (c.metrics.recall * 100).toFixed(2) + ''%</td><td>'' + (c.metrics.f1 * 100).toFixed(2) + ''%</td>'';
                
                const row2 = metricsBody.insertRow();
                const accClass = c.metrics.accuracy > 0.98 ? ''value-high'' : c.metrics.accuracy > 0.95 ? ''value-medium'' : ''value-low'';
                row2.innerHTML = ''<td><strong>'' + c.label + ''</strong></td><td class="'' + accClass + ''">''+  (c.metrics.accuracy * 100).toFixed(2) + ''%</td><td>'' + (c.metrics.precision * 100).toFixed(2) + ''%</td><td>'' + (c.metrics.recall * 100).toFixed(2) + ''%</td><td>'' + (c.metrics.f1 * 100).toFixed(2) + ''%</td><td>'' + c.metrics.inference_ms.toFixed(2) + '' ms</td><td>'' + c.config + ''</td>'';
            });
        }
        
        function populateMetrics() {
            const container = document.getElementById(''metrics-container'');
            const sorted = [...dashboardData.classifiers].sort((a, b) => b.metrics.accuracy - a.metrics.accuracy);
            const best = sorted[0];
            const bestF1 = [...dashboardData.classifiers].sort((a, b) => b.metrics.f1 - a.metrics.f1)[0];
            const fastest = [...dashboardData.classifiers].sort((a, b) => a.metrics.inference_ms - b.metrics.inference_ms)[0];
            
            container.innerHTML = ''
                <div class="metric-card">
                    <div class="label">🏆 最高正確率</div>
                    <div class="value">'' + (best.metrics.accuracy * 100).toFixed(2) + ''%</div>
                    <div style="margin-top:10px;font-size:0.9em;">'' + best.label + ''</div>
                </div>
                <div class="metric-card">
                    <div class="label">⭐ 最高 F1</div>
                    <div class="value">'' + (bestF1.metrics.f1 * 100).toFixed(2) + ''%</div>
                    <div style="margin-top:10px;font-size:0.9em;">'' + bestF1.label + ''</div>
                </div>
                <div class="metric-card">
                    <div class="label">⚡ 最快推論</div>
                    <div class="value">'' + fastest.metrics.inference_ms.toFixed(2) + ''ms</div>
                    <div style="margin-top:10px;font-size:0.9em;">'' + fastest.label + ''</div>
                </div>
                <div class="metric-card">
                    <div class="label">📊 評估系統</div>
                    <div class="value">'' + dashboardData.classifiers.length + ''</div>
                    <div style="margin-top:10px;font-size:0.9em;">已測試分類器</div>
                </div>
            '';
        }
        
        function initializeCharts() {
            const classifiers = dashboardData.classifiers;
            
            const accuracyCtx = document.getElementById(''accuracyChart'').getContext(''2d'');
            new Chart(accuracyCtx, {
                type: ''bar'',
                data: {
                    labels: classifiers.map(c => c.label),
                    datasets: [{
                        label: ''正確率'',
                        data: classifiers.map(c => (c.metrics.accuracy * 100).toFixed(2)),
                        backgroundColor: classifiers.map(c => {
                            const acc = c.metrics.accuracy;
                            return acc > 0.98 ? ''rgba(40, 167, 69, 0.8)'' : acc > 0.95 ? ''rgba(255, 193, 7, 0.8)'' : ''rgba(220, 53, 69, 0.8)'';
                        })
                    }]
                },
                options: {
                    indexAxis: ''y'',
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { x: { max: 100 } }
                }
            });
            
            const top5 = [...classifiers].sort((a, b) => b.metrics.accuracy - a.metrics.accuracy).slice(0, 5);
            const radarCtx = document.getElementById(''radarChart'').getContext(''2d'');
            new Chart(radarCtx, {
                type: ''radar'',
                data: {
                    labels: [''正確率'', ''精準度'', ''召回率'', ''F1分數''],
                    datasets: top5.map((c, i) => ({
                        label: c.label,
                        data: [c.metrics.accuracy * 100, c.metrics.precision * 100, c.metrics.recall * 100, c.metrics.f1 * 100],
                        borderColor: ''hsl('' + (i * 72) + '', 70%, 50%)'',
                        backgroundColor: ''hsla('' + (i * 72) + '', 70%, 50%, 0.2)'',
                        pointRadius: 4
                    }))
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: ''bottom'' } },
                    scales: { r: { beginAtZero: true, max: 100 } }
                }
            });
        }
        
        function generateComparison() {
            const classifiers = dashboardData.classifiers;
            const best = classifiers.reduce((a, b) => a.metrics.accuracy > b.metrics.accuracy ? a : b);
            const worst = classifiers.reduce((a, b) => a.metrics.accuracy < b.metrics.accuracy ? a : b);
            
            document.getElementById(''comparison-text'').innerHTML = ''
                <p>在本實驗中，我們訓練並評估了 '' + classifiers.length + '' 個機器學習分類器用於假性甲狀腺素檢測。最佳系統：<strong>'' + best.label + ''</strong>（正確率：'' + (best.metrics.accuracy * 100).toFixed(2) + ''%）。</p>
                <p>相比之下，'' + worst.label + ''（正確率：'' + (worst.metrics.accuracy * 100).toFixed(2) + ''%）表現較為遜色。通過系統的超參數調整和交叉驗證，我們驗證了集合演算法的優越性。</p>
            '';
            
            const avgAccuracy = (classifiers.reduce((sum, c) => sum + c.metrics.accuracy, 0) / classifiers.length * 100).toFixed(2);
            document.getElementById(''conclusion-text'').innerHTML = ''
                <p><strong>推薦系統：'' + best.label + ''</strong></p>
                <p>基於實驗結果，我們推薦採用 '' + best.label + '' 作為生產環境中的假性甲狀腺素分類系統。該系統在正確率（'' + (best.metrics.accuracy * 100).toFixed(2) + ''%）、精準度（'' + (best.metrics.precision * 100).toFixed(2) + ''%）和召回率（'' + (best.metrics.recall * 100).toFixed(2) + ''%）方面均表現優異。</p>
                <p>整體而言，本次實驗的 '' + classifiers.length + '' 個系統平均正確率達到 '' + avgAccuracy + ''%，表明機器學習方法在醫療診斷預測中具有重要應用價值。</p>
            '';
        }
    </script>
</body>
</html>
